[package]
name = "nexum"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
config = "0.14"
jsonrpsee = { version = "0.24", features = ["server", "macros"] }
pulldown-cmark = "0.12"
notify = "7"
thiserror = "2"
anyhow = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
